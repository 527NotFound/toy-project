<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web Server 2</title>
    <style>
        body {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 100px;
            font-family: Arial, sans-serif;
        }
        h1 {
            border-bottom: 2px solid red; /* 색상 변경 */
            display: inline-block;
            padding-bottom: 5px;
            margin-bottom: 30px;
        }
        img {
            display: block;
            margin: 0 auto 30px auto;
            max-width: 250px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        p {
            margin: 10px 0;
        }
        .active-status {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>2nd Web Server</h1>
    <img src="nazuna.jpeg" alt="Server Icon">
    <p>Port: 8002</p>
    <p>Load Balancing Test</p>
    <p>Current Time: <span id="current-time"></span></p>
    <p class="active-status">• ACTIVE</p>

    <script>
        function updateTime() {
            const now = new Date();
            const options = {
                year: 'numeric',
                month: 'numeric',
                day: 'numeric',
                hour: 'numeric',
                minute: 'numeric',
                second: 'numeric',
                hour12: false
            };
            document.getElementById('current-time').innerText = now.toLocaleString('en-US', options);
        }

        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
