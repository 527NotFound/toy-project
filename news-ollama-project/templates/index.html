<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Style News Summarizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a73e8; /* Google Blue */
            --secondary-color: #f0f0f0; /* Light Gray */
            --background-color: #ffffff;
            --text-color: #202124; /* Dark Gray */
            --light-text-color: #5f6368;
            --card-background: #f8f9fa;
            --border-color: #dadce0;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --input-background: #ffffff;
        }

        body {
            font-family: 'Google Sans', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            align-items: center;
        }

        .header {
            width: 100%;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 4px var(--shadow-color);
            background-color: var(--background-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        h1 {
            color: var(--text-color);
            margin: 0;
            font-size: 2.5em;
            font-weight: 500;
        }
        h1 span {
            color: var(--primary-color);
        }

        .main-content {
            flex-grow: 1;
            width: 100%;
            max-width: 900px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #loading {
            text-align: center;
            margin: 20px 0;
            color: var(--light-text-color);
            font-weight: bold;
            display: none;
            font-size: 1.1em;
        }
        .loading-animation {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-card {
            background-color: var(--card-background);
            border-radius: 16px;
            box-shadow: 0 1px 3px var(--shadow-color);
            padding: 25px;
            margin-top: 25px;
            width: 100%;
            box-sizing: border-box;
            display: none; /* 초기에는 숨김 */
        }

        .result-card h2 {
            color: var(--text-color);
            font-size: 1.6em;
            font-weight: 500;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .result-card pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            background: var(--input-background);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 1em;
            line-height: 1.6;
            color: var(--text-color);
        }

        .result-card p {
            color: var(--light-text-color);
            font-size: 0.9em;
            margin-top: 15px;
        }
        .result-card p strong {
            color: var(--text-color);
        }

        .input-area {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            box-sizing: border-box;
            background-color: var(--background-color);
            position: sticky;
            bottom: 0;
            box-shadow: 0 -2px 4px var(--shadow-color);
            display: flex;
            justify-content: center;
        }

        .input-group {
            display: flex;
            width: 100%;
            max-width: 700px; /* 입력창 최대 너비 */
            background-color: var(--input-background);
            border-radius: 25px;
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            box-shadow: 0 1px 3px var(--shadow-color);
        }

        input[type="text"] {
            flex-grow: 1;
            border: none;
            outline: none;
            padding: 10px;
            font-size: 1.1em;
            background: transparent;
            color: var(--text-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 1.5em;
            transition: background-color 0.3s ease;
            margin-left: 10px;
            flex-shrink: 0; /* 버튼이 줄어들지 않도록 */
        }
        button:hover {
            background-color: #0d47a1; /* Darker Google Blue */
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            h1 { font-size: 2em; }
            .main-content, .input-area { padding: 15px; }
            .input-group { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Ollama + <span>NewsAPI</span> Summarizer</h1>
    </div>

    <div class="main-content">
        <div id="loading" role="status" aria-live="polite">
            <div class="loading-animation"></div>
            뉴스 검색 및 요약 처리 중...
        </div>

        <div id="result" class="result-card" aria-live="polite">
            <h2>📝 요약 결과</h2>
            <pre id="summary_output">여기에 요약 결과가 표시됩니다.</pre>
            <p><strong>검색어:</strong> <span id="output_query"></span></p>
            <p><strong>처리된 기사 수:</strong> <span id="output_count"></span></p>
            <p><strong>뉴스 스니펫 (원문 일부):</strong></p>
            <pre id="snippet_output"></pre>
        </div>
    </div>

    <div class="input-area">
        <div class="input-group">
            <input type="text" id="query" placeholder="관심 있는 뉴스 검색어 (예: AI, Samsung, 경제)">
            <button onclick="summarizeNews()" id="submitButton" aria-label="뉴스 검색 및 요약">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="#FFFFFF"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2 .01 7z"/></svg>
            </button>
        </div>
    </div>

<script>
    const queryInput = document.getElementById('query');
    const submitButton = document.getElementById('submitButton');
    const loadingDiv = document.getElementById('loading');
    const resultDiv = document.getElementById('result');
    const summaryOutput = document.getElementById('summary_output');
    const outputQuery = document.getElementById('output_query');
    const outputCount = document.getElementById('output_count');
    const snippetOutput = document.getElementById('snippet_output');

    // Enter 키로도 제출 가능하도록
    queryInput.addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
            summarizeNews();
        }
    });

    async function summarizeNews() {
        const query = queryInput.value.trim(); // 앞뒤 공백 제거
        if (!query) {
            alert('검색어를 입력해주세요.');
            queryInput.focus();
            return;
        }

        // UI 상태 변경: 로딩 시작
        submitButton.disabled = true;
        queryInput.disabled = true;
        resultDiv.style.display = 'none';
        summaryOutput.textContent = ''; // 이전 결과 초기화
        outputQuery.textContent = '';
        outputCount.textContent = '';
        snippetOutput.textContent = '';
        loadingDiv.style.display = 'block';

        try {
            const response = await fetch('/api/process', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ query: query })
            });

            const data = await response.json();

            // UI 상태 변경: 로딩 종료, 결과 표시
            loadingDiv.style.display = 'none';
            resultDiv.style.display = 'block';
            submitButton.disabled = false;
            queryInput.disabled = false;

            if (data.success) {
                summaryOutput.textContent = data.result;
                outputQuery.textContent = data.query;
                outputCount.textContent = data.articles_count;
                snippetOutput.textContent = data.news_snippet;
            } else {
                summaryOutput.textContent = '❌ 오류 발생: ' + (data.result || '알 수 없는 오류');
                outputQuery.textContent = data.query; // 검색어는 표시
            }

        } catch (error) {
            // 통신 오류 처리
            loadingDiv.style.display = 'none';
            resultDiv.style.display = 'block';
            submitButton.disabled = false;
            queryInput.disabled = false;
            summaryOutput.textContent = '통신 오류가 발생했습니다. 서버 연결 상태를 확인하세요: ' + error.message;
            console.error('Fetch error:', error);
        }
        // 결과가 표시된 후 스크롤을 결과 영역으로 이동
        resultDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // 페이지 로드 시 입력 필드에 포커스
    window.onload = () => {
        queryInput.focus();
    };
</script>

</body>
</html>
